[package]
name = "api-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
# This crate has two binaries — the server and the `api-rs-db` schema tool — so
# a bare `cargo run` is ambiguous and cargo refuses to guess. The server is the
# primary artifact (it is what the Dockerfile ships), so name it as the default
# rather than making every caller pass `--bin api-rs`.
default-run = "api-rs"

[lib]
name = "api_rs"
path = "src/lib.rs"

[[bin]]
name = "api-rs"
path = "src/main.rs"

# Schema and seed management. Excluded from the release build by
# `cargo build --bin api-rs`, which is what the Dockerfile ships.
[[bin]]
name = "api-rs-db"
path = "src/bin/api-rs-db.rs"

[features]
default = []
# OTLP trace export is opt-in: it pulls the opentelemetry/tonic stack, which
# roughly doubles a cold build. /metrics + JSON logs work without it.
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15"
form_urlencoded = "1"
memory-stats = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
moka = { version = "0.12", features = ["future"] }
rand = "0.10"
redis = { version = "1", features = ["connection-manager", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring",
] }
thiserror = "2"
# Features are what this crate *calls*, not what its dependencies happen to
# enable. Feature unification means `redis`/`sqlx`/`hyper`/`tonic` currently pull
# in `time`, `sync` and `net` for us, which hides the real dependency: trimming
# or dropping any one of those crates would then break the build with an error
# pointing at unrelated files.
#   time  - metric samplers (telemetry.rs), request + health timeouts, cache tests
#   sync  - rate limiter's Mutex/Semaphore, and the singleflight fill locks
#   net   - the TcpListener in main.rs and the E2E server harness
# Do not "clean up" the seemingly redundant set.
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = "0.5"
tower-http = { version = "0.7", features = [
  "compression-br",
  "compression-deflate",
  "compression-gzip",
  "cors",
  "timeout",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

opentelemetry = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, features = [
  "grpc-tonic",
  "trace",
] }
opentelemetry_sdk = { version = "0.33", optional = true, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.34", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
testcontainers = "0.27"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "handlers"
harness = false
