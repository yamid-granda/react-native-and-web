global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # api-rs serves the contract port 3001 that both clients default to;
  # Grafana owns 3002. Change this target when measuring a non-default port.
  - job_name: api-rs
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:3001]
