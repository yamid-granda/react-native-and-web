packages:
  - "components-library"
  - "web-application"
  - "mobile-application"
  - "api-rs"

catalog:
  typescript: ^6.0.3
  vitest: ^5.0.0
  # Shared by components-library (MainNav) and web-application (the one
  # imperative router call) so both track the same version.
  solito: ^5.0.0
  # Pinned to Expo SDK 57's exact peer requirements (mobile-application),
  # and shared verbatim by web-application/components-library so pnpm's
  # hoisting dedupes to one instance instead of nesting version-conflict
  # copies — which broke Vitest/jsdom rendering (two live React instances).
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3

onlyBuiltDependencies:
  - esbuild
  - sharp
